# Bundle 补丁：profile 列出本 bundle 时，把下面这些行插入插件树。
#
# 这里插入了**两行**（同一个包的两个入口），它们在插件详情里是两栏，
# 可以各自启停、各自配置：
#   1) session-cost-plugin        —— 主行：取数路由 + UI（index.js）
#   2) session-cost-tools         —— 子路径行：只给 agent 一个 session_cost 工具（tools.js）
# 停掉第 2 行不影响输入框徽标与设置页面板；反之停掉第 1 行，第 2 行的工具仍可独立查询。
#
# 这里的 config 是**示例默认值**，也是改价的地方。你在自己的 profile 补丁层里按 id
# 覆盖时注意：config 是**整体替换、不深合并** —— 覆盖 rates 就要把整张表写全。
#
# 单价单位：人民币 / 百万 tokens，取 DeepSeek 官方《模型 & 价格》的**高峰时段价**；
# 空闲时段 = 高峰 × offPeakFactor（官方为 0.5）。键以 `*` 结尾表示前缀匹配，`*` 为兜底。
- insert:
    - id: session-cost-plugin
      name: dsh-plugin-session-cost
      config:
        currency: CNY
        symbol: ¥
        decimals: 4
        timeZone: Asia/Shanghai
        peakWeekdays: [1, 2, 3, 4, 5]
        peakWindows: ['09:00-12:00', '14:00-18:00']
        offPeakFactor: 0.5
        # 法定节假日无法凭空推算：把日期列在这里，当天整天按空闲价计。
        holidays: []
        refreshSeconds: 5
        persistedCacheSeconds: 600
        includeSubagents: true
        rates:
          deepseek-flash: { cacheHit: 0.04, cacheMiss: 2, output: 8 }
          deepseek-v4-flash: { cacheHit: 0.04, cacheMiss: 2, output: 8 }
          deepseek-v4-flash-vision-exp: { cacheHit: 0.04, cacheMiss: 2, output: 8 }
          'deepseek-v4.1-flash*': { cacheHit: 0.04, cacheMiss: 2, output: 8 }
          deepseek-v4-pro: { cacheHit: 0.3, cacheMiss: 9, output: 27 }
          deepseek-chat: { cacheHit: 0.5, cacheMiss: 2, output: 8 }
          deepseek-reasoner: { cacheHit: 1, cacheMiss: 4, output: 16 }
    # 第二行：独立启停 / 独立 Config（这里的 topN=8 有意不同于 schema 默认的 5，
    # 用来证明这一行的 config 是单独生效的）。
    - id: session-cost-tools
      name: dsh-plugin-session-cost/tools
      config:
        toolName: session_cost
        topN: 8
        includeSubagents: true
        symbol: ¥
        decimals: 4
