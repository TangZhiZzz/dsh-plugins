name: Release to npm

# 打 tag（v*）时把 packages/* 里版本号尚未发布过的包发布到 npm。
# 需要仓库 secret：NPM_TOKEN（npmjs.com 的 Automation token）。
# 没配 secret 时本 workflow 会跳过发布并给出 notice，不会变红。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # secret 先映射到一个**独立**变量名：NODE_AUTH_TOKEN 会被 setup-node 自己占用
    # （它会写入 github token），拿它做「有没有配 token」的判断会永远成立。
    env:
      NPM_PUBLISH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # 版本由 package.json 的 packageManager 决定，这里不要再传 version
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run package tests before publishing
        run: pnpm -r test
      - name: Probe the npm token (diagnostic)
        # 只做只读探测：token 能通过 whoami 说明「认证有效」；随后若发布仍 403，
        # 就说明是 token 权限/2FA-bypass 的问题而不是管道问题。顺带打印长度，
        # 便于发现复制粘贴带上的空白字符。
        run: |
          if [ -z "${NPM_PUBLISH_TOKEN:-}" ]; then
            echo "NPM_PUBLISH_TOKEN 为空"
            exit 0
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_PUBLISH_TOKEN" > "$RUNNER_TEMP/probe.npmrc"
          echo "token 长度：${#NPM_PUBLISH_TOKEN}"
          echo "token 指纹（sha256 前 8 位，用于确认 secret 是否真的换过）：$(printf '%s' "$NPM_PUBLISH_TOKEN" | sha256sum | cut -c1-8)"
          npm whoami --userconfig "$RUNNER_TEMP/probe.npmrc" \
            || echo "::warning title=npm token 探测失败::whoami 未通过：token 无效、权限为 No access，或带上了多余空白"
      - name: Publish packages whose version is not on npm yet
        # 用 shell 判断而不是 step 的 if：GitHub 的 env 上下文在 if 里拿不到 job 级 env 的值
        # （未定义会被判成 "不等于空串" 而误跑），也不能直接引用 secrets。
        run: |
          if [ -z "${NPM_PUBLISH_TOKEN:-}" ]; then
            echo "::notice title=NPM_TOKEN 未配置::跳过 npm 发布。请在仓库 Settings → Secrets and variables → Actions 添加 NPM_TOKEN（npm Classic Automation token，或允许绕过 2FA 的 Granular token，且要有 read and write 权限），然后重新运行本 workflow。"
            exit 0
          fi
          echo "使用仓库 secret NPM_TOKEN 发布"
          NODE_AUTH_TOKEN="$NPM_PUBLISH_TOKEN" pnpm -r publish --access public --no-git-checks --report-summary
